# Render blueprint – New + → Blueprint → pick this repository.
# Values marked "sync: false" are asked for when the blueprint is created (secrets never go into Git).
services:
  - type: web
    name: zerogap
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    region: frankfurt        # personal data of German insured persons – keep it in the EU
    healthCheckPath: /healthz
    disk:
      name: zerogap-data
      mountPath: /var/data   # zerogap.sqlite, outbox/ and the refreshed login tokens survive deploys
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: GOOGLE_CLIENT_FILE
        value: /var/data/secrets/google_client.json
      - key: GOOGLE_TOKEN_FILE
        value: /var/data/secrets/google_token.json
      - key: ARIS_TOKEN_FILE
        value: /var/data/secrets/aris_oauth.json
      - key: BASE_URL                # e.g. https://zerogap.onrender.com (your service URL, no trailing slash)
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        generateValue: true          # random password – shown under Environment in the dashboard
      - key: ARIS_SOURCE
        value: local
      - key: DRIVE_SOURCE
        value: local
      - key: MAIL_MODE
        value: outbox
      - key: REVIEW_EMAIL_TO
        sync: false
      - key: CASE_MANAGER_EMAIL
        sync: false
      - key: TEST_RECIPIENT
        sync: false
